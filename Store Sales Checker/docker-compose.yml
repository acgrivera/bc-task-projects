services:
  postgres:
    image: postgres:15
    container_name: store_sales_checker-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: pc_store
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
  etl_app:
    build: .
    container_name: store_sales_checker-etl
    depends_on:
    - postgres
volumes:
  postgres_data: